<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urna — Eleição de Síndico</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#edf1ef;--ink:#17231f;--mut:#6d7773;--green:#34a875;--orange:#e5a13b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px}
.urna{width:min(1050px,100%);background:#dfe4e2;border:1px solid #bbc5c1;border-radius:24px;padding:22px;box-shadow:0 25px 70px #17231f22;display:grid;grid-template-columns:1fr 340px;gap:22px}
.screen{background:#fff;border:2px solid #9da9a5;border-radius:12px;min-height:510px;padding:30px;position:relative}.head{border-bottom:1px solid #dbe1df;padding-bottom:15px;margin-bottom:20px}.head small{font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}.head h1{margin:5px 0 0;font-size:28px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:10px;font-weight:900;text-transform:uppercase;margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid #bdc8c4;border-radius:8px;font-size:17px}
.label{margin-top:25px;font-size:12px;font-weight:900;text-transform:uppercase}.digits{display:flex;gap:7px;margin:10px 0 20px}.digit{width:48px;height:58px;border:2px solid #263d36;display:grid;place-items:center;font-size:30px;font-weight:900;background:#fff}
.candidate{display:grid;grid-template-columns:1fr 125px;gap:15px;border-top:1px solid #e0e5e3;padding-top:16px}.candidate h2{font-size:30px;margin:0 0 7px}.candidate p{color:var(--mut);margin:5px 0}.photo{width:125px;height:150px;object-fit:cover;background:#e6ece9;border-radius:8px}
.message{font-size:34px;font-weight:900;margin-top:45px}.sub{color:var(--mut);line-height:1.5}.keypanel{background:#303a37;border-radius:16px;padding:18px;align-self:center}.keypanel h2{color:#fff;font-size:14px;text-align:center;margin:0 0 15px;letter-spacing:.08em}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.key{height:66px;border:0;border-radius:7px;background:#111816;color:#fff;font-size:25px;font-weight:900;box-shadow:0 4px 0 #070b0a;cursor:pointer}.zero{grid-column:2}.actions{display:grid;grid-template-columns:1fr 1fr 1.18fr;gap:7px;margin-top:17px}.action{height:60px;border:0;border-radius:7px;font-size:10px;font-weight:900;cursor:pointer}.white{background:#fff}.correct{background:var(--orange)}.confirm{background:var(--green);color:#fff}.footer{position:absolute;bottom:16px;left:30px;color:#8a9490;font-size:10px}
@media(max-width:800px){body{padding:8px}.urna{grid-template-columns:1fr;padding:12px}.screen{min-height:430px;padding:18px}.fields{grid-template-columns:1fr}.footer{display:none}}
</style></head><body>
<div class="urna"><section class="screen" id="screen"></section><section class="keypanel"><h2>TECLADO</h2><div class="nums" id="nums"></div><div class="actions"><button class="action white" id="blank">BRANCO</button><button class="action correct" id="correct">CORRIGE</button><button class="action confirm" id="confirm">CONFIRMA</button></div></section></div>
<script>
const sb=supabase.createClient('https://qwiwndnmnkxzysssascv.supabase.co','sb_publishable_c5DOiZK8ONTwmnc5K_bNZg_b8HC301E');
const $=id=>document.getElementById(id);
let election={condo_name:'Meu Condomínio',election_name:'Eleição para Síndico',urna_locked:false,election_closed:false},candidates=[],typed='',blank=false,busy=false;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function avatar(name){let x=(name||'?').split(/\s+/).slice(0,2).map(v=>v[0]||'').join('').toUpperCase();let svg=`<svg xmlns='http://www.w3.org/2000/svg' width='250' height='300'><rect width='100%' height='100%' fill='%23e5ebe8'/><circle cx='125' cy='95' r='52' fill='%23aebbb6'/><path d='M35 285c8-75 50-105 90-105s82 30 90 105' fill='%23aebbb6'/><text x='125' y='290' text-anchor='middle' font-family='Arial' font-size='28' fill='%235f706a'>${x}</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function activeCandidates(){if((election.current_round||1)===2){return candidates.filter(c=>[election.runoff_candidate_1,election.runoff_candidate_2].map(String).includes(String(c.id)))}return candidates}
function candidate(){return activeCandidates().find(c=>String(c.number)===typed)} function maxDigits(){return Math.max(2,...activeCandidates().map(c=>String(c.number).length))}
async function load(){let [e,c]=await Promise.all([sb.from('election').select('*').order('id').limit(1).single(),sb.from('candidates').select('*').order('number')]);if(!e.error)election=e.data;if(!c.error)candidates=c.data||[];render()}
function resetForm(){typed='';blank=false}
function render(){
 if(election.election_closed){$('screen').innerHTML=`<div class="head"><small>${esc(election.condo_name)}</small><h1>${esc(election.election_name)}</h1></div><div class="message">ELEIÇÃO ENCERRADA</div>`;return}
 if(election.urna_locked){$('screen').innerHTML=`<div class="head"><small>${esc(election.condo_name)}</small><h1>${esc(election.election_name)}</h1></div><div class="message">VOTO REGISTRADO</div><p class="sub">Aguardando o presidente de mesa liberar a urna para o próximo eleitor.</p>`;return}
 let c=candidate(),status=blank?'<div class="message">VOTO EM BRANCO</div>':c?`<div class="candidate"><div><h2>${esc(c.name)}</h2><p>${esc(c.slate||'')}</p><p>Número: <b>${esc(c.number)}</b></p></div><img class="photo" src="${c.photo_url||avatar(c.name)}"></div>`:typed.length>=maxDigits()?'<div class="message">VOTO NULO</div>':'<p class="sub">Digite o número do candidato usando o teclado físico ou virtual.</p>';
}
function digit(n){if(election.urna_locked||blank||busy)return;if(typed.length<maxDigits()){typed+=n;render()}}
$('nums').innerHTML=['1','2','3','4','5','6','7','8','9','0'].map(n=>`<button class="key ${n==='0'?'zero':''}" data-n="${n}">${n}</button>`).join('');
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>digit(b.dataset.n));
$('blank').onclick=()=>{if(!election.urna_locked){blank=true;typed='';render()}};$('correct').onclick=()=>{if(!election.urna_locked){blank=false;typed='';render()}};
async function finishRoundIfNeeded(){
 const round=election.current_round||1,total=parseInt(election.total_voters||0);
 if(!total)return;
 const {data:rv,error}=await sb.from('votes').select('*').eq('round',round);
 if(error||!rv||rv.length<total)return;
 const valid=rv.filter(v=>v.vote_type==='valid'), pool=activeCandidates();
 const ranking=pool.map(c=>({c,n:valid.filter(v=>String(v.candidate_id)===String(c.id)).length})).sort((a,b)=>b.n-a.n);
 for(const x of ranking)await sb.from('round_results').upsert({round,candidate_id:x.c.id,votes:x.n},{onConflict:'round,candidate_id'});
 if(round===1 && ranking.length>=2 && ranking[0].n===ranking[1].n){
   await sb.from('election').update({current_round:2,runoff_candidate_1:ranking[0].c.id,runoff_candidate_2:ranking[1].c.id,urna_locked:true,updated_at:new Date().toISOString()}).eq('id',election.id);
 }else{
   await sb.from('election').update({election_closed:true,urna_locked:true,updated_at:new Date().toISOString()}).eq('id',election.id);
 }
}
$('confirm').onclick=async()=>{if(busy||election.urna_locked)return;let c=candidate();if(!blank&&!typed)return alert('Digite o número do candidato ou escolha BRANCO.');
 busy=true;
 const round=election.current_round||1;
 const vote=await sb.from('votes').insert({vote_type:blank?'blank':c?'valid':'null',candidate_id:c?.id||null,round});
 if(vote.error){busy=false;return alert('Não foi possível registrar o voto. Tente novamente.')}
 const lock=await sb.from('election').update({urna_locked:true,updated_at:new Date().toISOString()}).eq('id',election.id);
 if(lock.error){busy=false;return alert('Voto registrado, mas houve erro ao bloquear a urna. Avise o presidente de mesa.')}
 election.urna_locked=true;await finishRoundIfNeeded();busy=false;await load();
};
window.addEventListener('keydown',e=>{if(election.urna_locked||busy)return;if(/^\d$/.test(e.key)){e.preventDefault();digit(e.key)}else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();blank=false;typed=typed.slice(0,-1);render()}else if(e.key==='Escape'){e.preventDefault();blank=false;typed='';render()}else if(e.key==='Enter'){e.preventDefault();$('confirm').click()}else if(e.key.toLowerCase()==='b'){e.preventDefault();$('blank').click()}});
sb.channel('urna-live').on('postgres_changes',{event:'*',schema:'public',table:'election'},p=>{let was=election.urna_locked;election=p.new||election;if(was&&!election.urna_locked)resetForm();render()}).on('postgres_changes',{event:'*',schema:'public',table:'candidates'},()=>load()).subscribe();
load();
</script></body></html>
