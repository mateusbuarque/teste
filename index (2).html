<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estreias SP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#08080a;
      --panel:#111116;
      --panel2:#17171d;
      --border:rgba(212,175,55,.22);
      --gold:#d4af37;
      --gold2:#f3e5ab;
      --goldGlow:rgba(212,175,55,.24);
      --text:#f8f9fa;
      --muted:#8a8d93;
      --green:#22c55e;
      --red:#e50914;
    }

    * { box-sizing:border-box; margin:0; padding:0; font-family:'Plus Jakarta Sans', sans-serif; }
    body {
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(212,175,55,.09), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(127,29,29,.08), transparent 40%),
        var(--bg);
      padding:28px 20px 42px;
    }

    header {
      max-width:1240px;
      margin:0 auto 26px;
      padding:20px 28px;
      border:1px solid var(--border);
      border-radius:18px;
      background:rgba(17,17,22,.88);
      backdrop-filter:blur(14px);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      box-shadow:0 14px 40px rgba(0,0,0,.55);
    }

    .brand-title {
      font-family:'Cinzel', serif;
      font-weight:900;
      font-size:1.65rem;
      letter-spacing:4px;
      text-transform:uppercase;
      background:linear-gradient(135deg,#fff, var(--gold), var(--gold2));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .brand-sub {
      font-size:.72rem;
      color:var(--gold);
      letter-spacing:2px;
      text-transform:uppercase;
      margin-top:3px;
    }

    .container { max-width:1240px; margin:0 auto; }

    .rooms-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(335px, 1fr));
      gap:22px;
    }

    .room-card {
      background:linear-gradient(180deg,#141419,#0f0f14);
      border:1px solid var(--border);
      border-radius:17px;
      padding:22px;
      transition:.25s;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      min-height:200px;
    }

    .room-title {
      font-family:'Cinzel', serif;
      font-weight:700;
      font-size:1.35rem;
    }
    .room-film { color:var(--gold); font-size:.81rem; margin-top:4px; }

    .btn-gold {
      width:100%;
      border:0;
      border-radius:9px;
      padding:13px 14px;
      background:linear-gradient(135deg,var(--gold), #b8860b);
      color:#000;
      font-weight:800;
      letter-spacing:.8px;
      text-transform:uppercase;
      cursor:pointer;
      transition:.2s;
      margin-top: 15px;
    }

    .loading-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:2000; display:none; align-items:center; justify-content:center; color:var(--gold); font-size:1.2rem; font-weight:700;
    }
  </style>

  <!-- SDK oficial do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="loading-overlay" id="loading">Conectando ao Supabase...</div>

  <header>
    <div>
      <div class="brand-title">Estreias SP</div>
      <div class="brand-sub">Pré-estreias dos filmes de Mateus Buarque em São Paulo</div>
    </div>
  </header>

  <div class="container">
    <main class="rooms-grid" id="roomsGrid"></main>
  </div>

  <script>
    // Suas credenciais do Supabase já configuradas
    const SUPABASE_URL = 'https://xzavingmpcjxnavyjqnt.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6YXZpbmdtcGNqeG5hdnlqcW50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMjAxMjgsImV4cCI6MjEwMjc5NjEyOH0.P5mUql8JuP2_fGcnZnx1pAX-aFuz55DSQnD_XwgvEas';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let movies = [];

    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'flex' : 'none';
    }

    // Busca os filmes cadastrados no Supabase
    async function loadMovies() {
      showLoading(true);
      try {
        const { data, error } = await _supabase.from('movies').select('*');
        if (error) throw error;
        movies = data || [];
        renderDashboard();
      } catch (err) {
        console.error("Erro ao carregar do Supabase:", err);
        alert("Erro ao conectar com o banco de dados do Supabase.");
      } finally {
        showLoading(false);
      }
    }

    function renderDashboard() {
      const grid = document.getElementById("roomsGrid");
      grid.innerHTML = "";

      if (!movies.length) {
        grid.innerHTML = '<div style="color:var(--muted);text-align:center;grid-column:1/-1;">Nenhum filme cadastrado no banco ainda. Adicione linhas na tabela "movies" pelo painel do Supabase.</div>';
        return;
      }

      movies.forEach(movie => {
        const card = document.createElement("article");
        card.className = "room-card";
        card.innerHTML = `
          <div>
            <div class="room-title">${movie.title}</div>
            <div class="room-film">Sala 0${movie.roomId || 1} ${movie.date ? '• ' + movie.date : ''} ${movie.time ? 'às ' + movie.time : ''}</div>
          </div>
          <button class="btn-gold" onclick="alert('Conectado ao filme ID: ${movie.id}')">Reservar Assento</button>
        `;
        grid.appendChild(card);
      });
    }

    // Inicialização
    loadMovies();
  </script>
</body>
</html>
